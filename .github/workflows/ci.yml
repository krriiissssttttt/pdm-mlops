name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Gitleaks scans the full history

      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # TODO 7d (optional): add ONE extra quality or security step here. Options:
      #   Lint the code:          run: pip install ruff && ruff check .
      #   Scan code for bugs:     run: pip install bandit && bandit -r app.py train.py
      #   Scan dependencies:      run: pip install pip-audit && pip-audit -r requirements.txt
      # THINK: where in the order should it go? Before training, or at the very end?
      # CHOSEN (7d): Bandit, placed BEFORE training. DISCUSSION (open-ended): a static scan only needs the
      #   source code, is fast, and a finding should stop the pipeline before any time is spent training.
      - name: Scan code for security problems (Bandit)
        run: pip install bandit && bandit -r app.py train.py

      - name: Scan dependencies for known vulnerabilities (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt

      # TODO 7a: run the training script (it also enforces your quality gate).
      - name: Train, track in MLflow and register
        run: python train.py

      # TODO 7b: run the tests.  HINT: the same command you used in Part 4, without the "!"
      - name: Run tests
        run: python -m pytest -q

      # TODO 7c: build the Docker image and tag it "machine-failure-api".
      # THINK: why build the image only AFTER the tests pass?
      # DISCUSSION (open-ended): the image contains model.joblib, which is only trustworthy once the quality
      #   gate and the tests have passed. Building later also avoids wasting time on a broken model.
      - name: Build Docker image
        run: docker build -t machine-failure-api .

      - name: Smoke test the running container
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          API_KEY="${API_KEY:-$(openssl rand -hex 16)}"   # fork PRs get no secrets, so fall back to a random key
          docker run -d -p 8000:8000 -e API_KEY="$API_KEY" --name api machine-failure-api
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"air_temp_k":300,"process_temp_k":310.5,"rotational_speed_rpm":1550,"torque_nm":62,"tool_wear_min":230}')" = 401
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '{"air_temp_k":300,"process_temp_k":310.5,"rotational_speed_rpm":1550,"torque_nm":62,"tool_wear_min":230}'
          docker logs api

      - name: Save model and MLflow records
        uses: actions/upload-artifact@v4
        with:
          name: model-and-mlflow
          path: |
            model.joblib
            metrics.json
            mlflow.db
            mlruns/
            mlartifacts/
          if-no-files-found: warn
